<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports | Sri Krishna Collection</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* =========================================================
   SRI KRISHNA COLLECTION
   ADMIN REPORTS - PREMIUM STYLE
   ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            background: #f6f7fb;
            color: #1f2937;
        }

        /* =========================================================
   MAIN CONTAINER
   ========================================================= */

        .reports-container {
            padding: 30px 35px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* =========================================================
   HEADER
   ========================================================= */

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .report-title-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .report-title-icon {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: linear-gradient(135deg,
                    #111827,
                    #374151);

            color: #ffffff;

            font-size: 21px;

            box-shadow:
                0 8px 20px rgba(17, 24, 39, 0.18);
        }

        .report-header h1 {
            font-size: 28px;
            font-weight: 750;
            letter-spacing: -0.5px;
            color: #111827;
        }

        .report-header p {
            margin-top: 5px;
            color: #6b7280;
            font-size: 14px;
        }

        /* =========================================================
   HEADER ACTIONS
   ========================================================= */

        .report-actions {
            display: flex;
            gap: 10px;
        }

        .report-btn {
            border: 1px solid #e5e7eb;

            background: #ffffff;
            color: #374151;

            padding: 11px 17px;

            border-radius: 9px;

            font-size: 13px;
            font-weight: 650;

            cursor: pointer;

            transition: all 0.2s ease;

            box-shadow:
                0 2px 7px rgba(0, 0, 0, 0.04);
        }

        .report-btn:hover {
            background: #111827;
            color: #ffffff;
            border-color: #111827;

            transform: translateY(-1px);
        }

        .report-btn i {
            margin-right: 7px;
        }

        /* =========================================================
   STATISTICS GRID
   ========================================================= */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 18px;

            margin-bottom: 25px;
        }

        /* =========================================================
   STAT CARD
   ========================================================= */

        .stat-card {
            position: relative;

            background: #ffffff;

            border: 1px solid #eef0f4;

            border-radius: 15px;

            padding: 21px;

            min-height: 145px;

            overflow: hidden;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

            box-shadow:
                0 4px 18px rgba(15, 23, 42, 0.045);
        }

        .stat-card::after {
            content: "";

            position: absolute;

            width: 75px;
            height: 75px;

            right: -25px;
            bottom: -28px;

            border-radius: 50%;

            background: #f3f4f6;

            opacity: 0.8;
        }

        .stat-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 28px rgba(15, 23, 42, 0.09);
        }

        /* =========================================================
   STAT TOP
   ========================================================= */

        .stat-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-title {
            color: #6b7280;

            font-size: 13px;

            font-weight: 650;

            text-transform: uppercase;

            letter-spacing: 0.4px;
        }

        /* =========================================================
   STAT ICON
   ========================================================= */

        .stat-icon {
            width: 43px;
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: #f3f4f6;

            color: #374151;

            font-size: 17px;

            position: relative;
            z-index: 2;
        }

        /* =========================================================
   STAT VALUE
   ========================================================= */

        .stat-value {
            position: relative;
            z-index: 2;

            margin-top: 19px;

            color: #111827;

            font-size: 27px;

            font-weight: 750;

            letter-spacing: -0.5px;
        }

        /* =========================================================
   REPORT CARD
   ========================================================= */

        .report-card {
            background: #ffffff;

            border: 1px solid #eef0f4;

            border-radius: 16px;

            box-shadow:
                0 5px 20px rgba(15, 23, 42, 0.05);

            overflow: hidden;
        }

        /* =========================================================
   REPORT CARD HEADER
   ========================================================= */

        .report-card-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 21px 24px;

            border-bottom: 1px solid #eef0f4;
        }

        .report-card-header h2 {
            font-size: 18px;

            font-weight: 720;

            color: #111827;
        }

        /* =========================================================
   TABLE
   ========================================================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 900px;
        }

        thead {
            background: #f8fafc;
        }

        th {
            padding: 14px 18px;

            text-align: left;

            color: #64748b;

            font-size: 11px;

            font-weight: 750;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            border-bottom: 1px solid #e9edf2;

            white-space: nowrap;
        }

        td {
            padding: 16px 18px;

            color: #374151;

            font-size: 13px;

            border-bottom: 1px solid #f0f2f5;

            white-space: nowrap;
        }

        tbody tr {
            transition: background 0.18s ease;
        }

        tbody tr:hover {
            background: #fafbfc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* =========================================================
   PAYMENT ID
   ========================================================= */

        td:first-child {
            font-weight: 700;
            color: #111827;
        }

        /* =========================================================
   ORDER ID
   ========================================================= */

        td:nth-child(2) {
            font-weight: 650;
        }

        /* =========================================================
   PAYMENT METHOD
   ========================================================= */

        .method {
            font-weight: 700;
            color: #374151;
        }

        /* =========================================================
   AMOUNT
   ========================================================= */

        td:nth-child(4) {
            font-weight: 700;
            color: #111827;
        }

        /* =========================================================
   STATUS
   ========================================================= */

        .status {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 82px;

            padding: 6px 11px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 750;

            letter-spacing: 0.2px;
        }

        .status::before {
            content: "";

            width: 6px;
            height: 6px;

            border-radius: 50%;

            margin-right: 6px;

            background: currentColor;
        }

        /* SUCCESS */

        .success {
            background: #ecfdf3;
            color: #15803d;
        }

        /* PENDING */

        .pending {
            background: #fff8e6;
            color: #b45309;
        }

        /* FAILED */

        .failed {
            background: #fff1f2;
            color: #dc2626;
        }

        /* =========================================================
   TRANSACTION ID
   ========================================================= */

        td:nth-child(6) {
            max-width: 180px;

            overflow: hidden;

            text-overflow: ellipsis;

            font-family: "Consolas", "Courier New", monospace;

            font-size: 11px;

            color: #64748b;
        }

        /* =========================================================
   EMPTY STATE
   ========================================================= */

        .empty {
            text-align: center;

            padding: 60px 20px !important;

            color: #9ca3af;

            font-size: 14px;
        }

        .empty::before {
            content: "\f1d8";

            font-family: "Font Awesome 6 Free";

            font-weight: 900;

            display: block;

            margin-bottom: 12px;

            font-size: 28px;

            color: #d1d5db;
        }

        /* =========================================================
   SCROLLBAR
   ========================================================= */

        .table-wrapper::-webkit-scrollbar {
            height: 7px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: #f5f5f5;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #d1d5db;

            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        /* =========================================================
   RESPONSIVE
   ========================================================= */

        @media (max-width: 1200px) {

            .stats-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 700px) {

            .reports-container {
                padding: 20px 15px;
            }

            .report-header {
                align-items: flex-start;

                flex-direction: column;

                gap: 18px;
            }

            .report-actions {
                width: 100%;
            }

            .report-btn {
                flex: 1;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .report-header h1 {
                font-size: 23px;
            }
        }

        /* =========================================================
   PRINT
   ========================================================= */

        @media print {

            body {
                background: white;
            }

            .reports-container {
                padding: 0;
            }

            .report-actions {
                display: none;
            }

            .stat-card,
            .report-card {
                box-shadow: none;
                border: 1px solid #ddd;
            }

            .stat-card:hover {
                transform: none;
            }
        }
    </style>

<link rel="stylesheet" th:href="@{/css/admin-back.css}"></head>

<body>

    <div class="reports-container">

        <!-- =================================================
         HEADER
         ================================================= -->

        <div class="report-header">

            <div class="report-title-area">

                <div class="report-title-icon">
                    <i class="fa-solid fa-chart-line"></i>
                </div>

                <div>
                    <h1>Reports</h1>

                    <p>
                        Business performance and payment overview
                    </p>
                </div>

            </div>

            <div class="report-actions">

                <button type="button" class="report-btn" onclick="window.print()">

                    <i class="fa-solid fa-print"></i>
                    Print Report

                </button>

            </div>

        </div>


        <!-- =================================================
         STATISTICS
         ================================================= -->

        <div class="stats-grid">

            <!-- TOTAL PAYMENTS -->

            <div class="stat-card">

                <div class="stat-top">

                    <span class="stat-title">
                        Total Payments
                    </span>

                    <div class="stat-icon">
                        <i class="fa-solid fa-money-bill"></i>
                    </div>

                </div>

                <div class="stat-value" th:text="${totalPayments}">
                    0
                </div>

            </div>


            <!-- SUCCESS -->

            <div class="stat-card">

                <div class="stat-top">

                    <span class="stat-title">
                        Successful
                    </span>

                    <div class="stat-icon">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>

                </div>

                <div class="stat-value" th:text="${successfulPayments}">
                    0
                </div>

            </div>


            <!-- PENDING -->

            <div class="stat-card">

                <div class="stat-top">

                    <span class="stat-title">
                        Pending
                    </span>

                    <div class="stat-icon">
                        <i class="fa-solid fa-clock"></i>
                    </div>

                </div>

                <div class="stat-value" th:text="${pendingPayments}">
                    0
                </div>

            </div>


            <!-- FAILED -->

            <div class="stat-card">

                <div class="stat-top">

                    <span class="stat-title">
                        Failed
                    </span>

                    <div class="stat-icon">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </div>

                </div>

                <div class="stat-value" th:text="${failedPayments}">
                    0
                </div>

            </div>


            <!-- REVENUE -->

            <div class="stat-card">

                <div class="stat-top">

                    <span class="stat-title">
                        Successful Revenue
                    </span>

                    <div class="stat-icon">
                        <i class="fa-solid fa-indian-rupee-sign"></i>
                    </div>

                </div>

                <div class="stat-value">

                    ₹
                    <span th:text="${successfulRevenue}">
                        0.00
                    </span>

                </div>

            </div>


            <!-- COD -->

            <div class="stat-card">

                <div class="stat-top">

                    <span class="stat-title">
                        COD Payments
                    </span>

                    <div class="stat-icon">
                        <i class="fa-solid fa-truck"></i>
                    </div>

                </div>

                <div class="stat-value" th:text="${codPayments}">
                    0
                </div>

            </div>


            <!-- RAZORPAY -->

            <div class="stat-card">

                <div class="stat-top">

                    <span class="stat-title">
                        Razorpay
                    </span>

                    <div class="stat-icon">
                        <i class="fa-solid fa-credit-card"></i>
                    </div>

                </div>

                <div class="stat-value" th:text="${razorpayPayments}">
                    0
                </div>

            </div>

        </div>


        <!-- =================================================
         PAYMENT REPORT
         ================================================= -->

        <div class="report-card">

            <div class="report-card-header">

                <h2>
                    Payment Report
                </h2>

            </div>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Order ID</th>

                            <th>Method</th>

                            <th>Amount</th>

                            <th>Status</th>

                            <th>Transaction</th>

                            <th>Date</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="payment : ${payments}">

                            <td th:text="${payment.id}">
                                1
                            </td>

                            <td th:text="${payment.orderId}">
                                1001
                            </td>

                            <td class="method" th:text="${payment.paymentMethod}">
                                RAZORPAY
                            </td>

                            <td>

                                ₹
                                <span th:text="${payment.amount}">
                                    0
                                </span>

                            </td>

                            <td>

                                <span class="status" th:classappend="${payment.paymentStatus == 'SUCCESS'} ? ' success' :
                                             (${payment.paymentStatus == 'PENDING'} ? ' pending' : ' failed')"
                                    th:text="${payment.paymentStatus}">
                                    SUCCESS
                                </span>

                            </td>

                            <td th:text="${payment.transactionId != null ?
                                  payment.transactionId : '-'}">
                                -
                            </td>

                            <td th:text="${payment.createdAt != null ?
                                  #temporals.format(payment.createdAt, 'dd-MM-yyyy HH:mm') :
                                  '-'}">
                                -
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(payments)}">

                            <td colspan="7" class="empty">

                                No payment records available.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

<script th:src="@{/js/admin-back.js}"></script></body>

</html>
