<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payment Details | Sri Krishna Collection</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body {
            background: #f7f5ef;
            color: #244443;
            font-family: Jost, Arial, sans-serif;
        }

        .details-page {
            width: min(950px, calc(100% - 30px));
            margin: 45px auto;
        }

        .details-card {
            background: #fff;
            border: 1px solid #ddd9d0;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,.06);
        }

        .details-header {
            padding: 28px;
            background: #126a68;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .details-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .details-header p {
            margin: 5px 0 0;
            opacity: .8;
            font-size: 11px;
        }

        .details-body {
            padding: 30px;
        }

        .detail-item {
            padding: 17px;
            border: 1px solid #e5e1d9;
            border-radius: 10px;
            margin-bottom: 14px;
        }

        .detail-label {
            display: block;
            color: #999f9c;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .detail-value {
            color: #263f3e;
            font-size: 14px;
            font-weight: 600;
            word-break: break-word;
        }

        .success {
            color: #21845c;
        }

        .pending {
            color: #ad7816;
        }

        .failed {
            color: #b5443e;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 18px;
            padding: 10px 17px;
            border-radius: 7px;
            background: #126a68;
            color: #fff;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
        }

        .back-button:hover {
            background: #0d514f;
            color: #fff;
        }

    </style>

<link rel="stylesheet" th:href="@{/css/admin-back.css}"></head>

<body>

<div class="details-page">

    <div class="details-card">


        <!-- HEADER -->

        <div class="details-header">

            <div>

                <h1>
                    Payment Details
                </h1>

                <p>
                    Sri Krishna Collection
                </p>

            </div>

            <i class="fa-solid fa-receipt fa-2x"></i>

        </div>


        <!-- BODY -->

        <div class="details-body">


            <div class="row">


                <!-- PAYMENT ID -->

                <div class="col-md-6">

                    <div class="detail-item">

                        <span class="detail-label">
                            PAYMENT ID
                        </span>

                        <span
                            class="detail-value"
                            th:text="${payment.id}">
                            1
                        </span>

                    </div>

                </div>


                <!-- ORDER ID -->

                <div class="col-md-6">

                    <div class="detail-item">

                        <span class="detail-label">
                            ORDER ID
                        </span>

                        <span
                            class="detail-value"
                            th:text="${payment.orderId}">
                            1
                        </span>

                    </div>

                </div>


                <!-- METHOD -->

                <div class="col-md-6">

                    <div class="detail-item">

                        <span class="detail-label">
                            PAYMENT METHOD
                        </span>

                        <span
                            class="detail-value"
                            th:text="${payment.paymentMethod}">
                            RAZORPAY
                        </span>

                    </div>

                </div>


                <!-- AMOUNT -->

                <div class="col-md-6">

                    <div class="detail-item">

                        <span class="detail-label">
                            AMOUNT
                        </span>

                        <span class="detail-value">

                            ₹

                            <span
                                th:text="${#numbers.formatDecimal(payment.amount, 1, 2)}">
                                500.00
                            </span>

                        </span>

                    </div>

                </div>


                <!-- STATUS -->

                <div class="col-md-6">

                    <div class="detail-item">

                        <span class="detail-label">
                            PAYMENT STATUS
                        </span>

                        <span
                            class="detail-value"
                            th:classappend="${payment.paymentStatus == 'SUCCESS'}
                            ? ' success'
                            : (${payment.paymentStatus == 'FAILED'}
                            ? ' failed'
                            : ' pending')"
                            th:text="${payment.paymentStatus}">
                            SUCCESS
                        </span>

                    </div>

                </div>


                <!-- TRANSACTION -->

                <div class="col-md-6">

                    <div class="detail-item">

                        <span class="detail-label">
                            TRANSACTION ID
                        </span>

                        <span
                            class="detail-value"
                            th:text="${payment.transactionId != null ? payment.transactionId : '—'}">
                            pay_xxxxx
                        </span>

                    </div>

                </div>


                <!-- RAZORPAY ORDER -->

                <div class="col-md-6">

                    <div class="detail-item">

                        <span class="detail-label">
                            RAZORPAY ORDER ID
                        </span>

                        <span
                            class="detail-value"
                            th:text="${payment.razorpayOrderId != null ? payment.razorpayOrderId : '—'}">
                            order_xxxxx
                        </span>

                    </div>

                </div>


                <!-- RAZORPAY PAYMENT -->

                <div class="col-md-6">

                    <div class="detail-item">

                        <span class="detail-label">
                            RAZORPAY PAYMENT ID
                        </span>

                        <span
                            class="detail-value"
                            th:text="${payment.razorpayPaymentId != null ? payment.razorpayPaymentId : '—'}">
                            pay_xxxxx
                        </span>

                    </div>

                </div>


                <!-- DATE -->

                <div class="col-md-6">

                    <div class="detail-item">

                        <span class="detail-label">
                            CREATED DATE
                        </span>

                        <span
                            class="detail-value"
                            th:text="${payment.createdAt != null ? #temporals.format(payment.createdAt, 'dd MMM yyyy, hh:mm a') : '—'}">
                            18 Aug 2026
                        </span>

                    </div>

                </div>

            </div>


            <a
                href="/admin/payments"
                class="back-button">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Payments

            </a>

        </div>

    </div>

</div>

<script th:src="@{/js/admin-back.js}"></script></body>

</html>
