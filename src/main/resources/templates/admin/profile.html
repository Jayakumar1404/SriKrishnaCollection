<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Profile | Sri Krishna Collection</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>body{background:#f7f5f0;font-family:Jost,sans-serif}.card{max-width:650px;margin:70px auto;border:0;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.08)}.avatar{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:#111;color:#c9a227;font-size:38px;margin:auto}.gold{color:#9b7b18}</style>
<link rel="stylesheet" th:href="@{/css/admin-back.css}"></head><body>
<div class="container"><div class="card p-5 text-center">
<div class="avatar"><i class="fa-solid fa-user-shield"></i></div>
<h2 class="mt-4">Administrator Profile</h2>
<p class="text-muted">Sri Krishna Collection Admin Panel</p>
<div class="row g-3 text-start mt-2"><div class="col-12"><strong>Username</strong><div class="form-control" th:text="${adminUsername}">admin</div></div><div class="col-12"><strong>Role</strong><div class="form-control">Administrator</div></div><div class="col-12"><strong>Status</strong><div class="form-control gold">Active &amp; System Online</div></div></div>
<div class="d-flex gap-2 justify-content-center mt-4"><a class="btn btn-dark" href="/admin/dashboard"><i class="fa-solid fa-house"></i> Dashboard</a><a class="btn btn-outline-dark" href="/admin/settings"><i class="fa-solid fa-gear"></i> Settings</a><button class="btn btn-outline-secondary" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back</button></div>
</div></div><script th:src="@{/js/admin-back.js}"></script></body></html>
