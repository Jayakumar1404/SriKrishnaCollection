<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle != null ? pageTitle : 'Category Form'}">
        Category Form
    </title>


    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Jost:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet">


    <!-- Category CSS -->

    <link
        rel="stylesheet"
        th:href="@{/css/admin-category.css}">

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar admin-navbar">

    <div class="container">


        <a
            class="admin-brand"
            th:href="@{/admin/dashboard}">


            <span class="admin-brand-icon">

                <i class="fa-solid fa-crown"></i>

            </span>


            <span>

                <small>SRI KRISHNA</small>

                COLLECTION ADMIN

            </span>


        </a>



        <div>

            <a
                th:href="@{/admin/categories}"
                class="btn btn-sm text-white">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Categories

            </a>

        </div>


    </div>

</nav>



<!-- =====================================================
     MAIN
===================================================== -->

<div class="container admin-page">


    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">


            <!-- =================================================
                 FORM CARD
            ================================================== -->

            <div class="category-table-card">


                <!-- HEADER -->

                <div class="p-4 border-bottom">

                    <h1 class="page-title mb-2">

                        <i class="fa-solid fa-layer-group page-title-icon"></i>

                        <span
                            th:text="${category.id == null
                            ? 'Add Category'
                            : 'Edit Category'}">

                            Add Category

                        </span>

                    </h1>


                    <p class="page-subtitle mb-0">

                        Create or update your product category.

                    </p>

                </div>



                <!-- =================================================
                     FORM
                ================================================== -->

                <div class="p-4">


                    <form
                        th:action="${category.id == null}
                        ? @{/admin/categories/save}
                        : @{/admin/categories/update}"
                        th:object="${category}"
                        method="post"
                        enctype="multipart/form-data">


                        <!-- Hidden ID -->

                        <input
                            type="hidden"
                            th:field="*{id}">



                        <!-- =================================================
                             CATEGORY NAME
                        ================================================== -->

                        <div class="mb-4">

                            <label
                                for="categoryName"
                                class="form-label">

                                Category Name

                                <span class="text-danger">
                                    *
                                </span>

                            </label>


                            <input
                                type="text"
                                id="categoryName"
                                class="form-control"
                                th:field="*{name}"
                                placeholder="Enter category name"
                                autocomplete="off"
                                required>

                        </div>



                        <!-- =================================================
                             DESCRIPTION
                        ================================================== -->

                        <div class="mb-4">

                            <label
                                for="categoryDescription"
                                class="form-label">

                                Description

                            </label>


                            <textarea
                                id="categoryDescription"
                                class="form-control"
                                rows="5"
                                th:field="*{description}"
                                placeholder="Enter category description">
                            </textarea>

                        </div>



                        <!-- =================================================
                             CLOUDINARY IMAGE
                        ================================================== -->

                        <div class="mb-4">

                            <label
                                for="imageFile"
                                class="form-label">

                                Category Image

                            </label>


                            <input
                                type="file"
                                id="imageFile"
                                name="imageFile"
                                class="form-control"
                                accept="image/*">


                            <div class="form-text">

                                Select JPG, JPEG, PNG or WEBP image.

                                <br>

                                The image will be uploaded to
                                <strong>Cloudinary</strong>.

                            </div>

                        </div>



                        <!-- =================================================
                             IMAGE PREVIEW
                        ================================================== -->

                        <div class="text-center mb-4">


                            <!-- Existing Cloudinary Image -->

                            <img
                                th:if="${category.image != null and !#strings.isEmpty(category.image)}"
                                id="previewImage"
                                th:src="${category.image}"
                                width="300"
                                height="220"
                                class="img-thumbnail"
                                alt="Category Image">


                            <!-- New / Empty Preview -->

                            <img
                                th:unless="${category.image != null and !#strings.isEmpty(category.image)}"
                                id="previewImage"
                                src="https://placehold.co/300x220?text=Category+Image"
                                width="300"
                                height="220"
                                class="img-thumbnail"
                                alt="Category Preview">

                        </div>



                        <!-- =================================================
                             BUTTONS
                        ================================================== -->

                        <div class="d-flex gap-2">


                            <!-- BACK -->

                            <a
                                th:href="@{/admin/categories}"
                                class="btn btn-secondary flex-fill">

                                <i class="fa-solid fa-arrow-left"></i>

                                Cancel

                            </a>



                            <!-- SAVE / UPDATE -->

                            <button
                                type="submit"
                                class="btn btn-success flex-fill">


                                <i
                                    th:class="${category.id == null}
                                    ? 'fa-solid fa-floppy-disk'
                                    : 'fa-solid fa-pen-to-square'">
                                </i>


                                <span
                                    th:text="${category.id == null}
                                    ? 'Save Category'
                                    : 'Update Category'">

                                    Save Category

                                </span>


                            </button>


                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     IMAGE PREVIEW JAVASCRIPT
===================================================== -->

<script>

    document.addEventListener("DOMContentLoaded", function () {

        const imageInput =
            document.getElementById("imageFile");

        const previewImage =
            document.getElementById("previewImage");


        if (imageInput && previewImage) {

            imageInput.addEventListener("change", function () {

                const file = this.files[0];


                if (file) {

                    const reader =
                        new FileReader();


                    reader.onload = function (event) {

                        previewImage.src =
                            event.target.result;

                    };


                    reader.readAsDataURL(file);

                }

            });

        }

    });

</script>



</body>

</html>
