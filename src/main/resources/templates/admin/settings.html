<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Settings | Sri Krishna Collection</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>body{background:#f7f5f0;font-family:Jost,sans-serif}.card{max-width:700px;margin:60px auto;border:0;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.08)}.setting{border:1px solid #e7e2d9;border-radius:12px;padding:18px;margin-bottom:12px;background:#fff}</style>
<link rel="stylesheet" th:href="@{/css/admin-back.css}"></head><body><div class="container"><div class="card p-4 p-md-5"><h2><i class="fa-solid fa-gear"></i> Admin Settings</h2><p class="text-muted">Manage administrator account information.</p><div class="setting"><strong>Administrator</strong><div th:text="${adminUsername}">admin</div></div><div class="setting"><strong>Account Status</strong><div class="text-success">Active</div></div><div class="setting"><strong>Security</strong><div>Password authentication is enabled for the admin account.</div></div><div class="d-flex gap-2 mt-3"><a class="btn btn-dark" href="/admin/profile"><i class="fa-solid fa-user"></i> Profile</a><a class="btn btn-outline-dark" href="/admin/dashboard"><i class="fa-solid fa-house"></i> Dashboard</a><button class="btn btn-outline-secondary" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back</button></div></div></div><script th:src="@{/js/admin-back.js}"></script></body></html>
