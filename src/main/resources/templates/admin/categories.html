<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Category Management | Sri Krishna Collection</title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Jost:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet">


    <!-- =====================================================
         ADMIN CATEGORY CSS
    ====================================================== -->

    <link
        rel="stylesheet" th:href="@{/css/admin-categories.css}">

</head>

<body>

            <!-- =====================================================
                ADMIN NAVBAR
            ====================================================== -->

<nav class="navbar admin-navbar">

    <div class="container">

        <a
            class="admin-brand"
            th:href="@{/admin/dashboard}">

            <span class="admin-brand-icon">

                <i class="fa-solid fa-crown"></i>

            </span>


            <span>

                <small>SRI KRISHNA</small>

                COLLECTION ADMIN

            </span>

        </a>


        <div class="d-flex align-items-center gap-2">

            <a
                th:href="@{/admin/dashboard}"
                class="btn btn-sm text-white">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </a>

        </div>

    </div>

</nav>



<!-- =====================================================
     MAIN CONTENT
====================================================== -->

<div class="container admin-page">


    <!-- =================================================
         PAGE HEADER
    ================================================== -->

    <div class="page-header">

        <div>

            <h1 class="page-title">

                <i class="fa-solid fa-layer-group page-title-icon"></i>

                Category Management

            </h1>


            <p class="page-subtitle">

                Manage your product categories and collections

            </p>

        </div>

        <!-- =================================================
             ADD CATEGORY BUTTON
        ================================================== -->

        <button
            type="button"
            class="btn-add-category"
            id="addCategoryBtn">

            <i class="fa-solid fa-plus"></i>

            Add Category

        </button>

    </div>

    <!-- =================================================
         SUCCESS MESSAGE
    ================================================== -->

    <div
        th:if="${success}"
        class="alert alert-success alert-dismissible fade show"
        role="alert">

        <i class="fa-solid fa-circle-check me-2"></i>

        <span th:text="${success}"></span>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert">
        </button>

    </div>



    <!-- =================================================
         ERROR MESSAGE
    ================================================== -->

    <div
        th:if="${error}"
        class="alert alert-danger alert-dismissible fade show"
        role="alert">

        <i class="fa-solid fa-circle-exclamation me-2"></i>

        <span th:text="${error}"></span>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert">
        </button>

    </div>



    <!-- =================================================
         SEARCH
    ================================================== -->

    <div class="category-search">

        <div class="category-search-icon">

            <i class="fa-solid fa-magnifying-glass"></i>

        </div>


        <input
            type="text"
            id="searchCategory"
            autocomplete="off"
            placeholder="Search categories...">

    </div>



    <!-- =================================================
         CATEGORY TABLE
    ================================================== -->

    <div class="category-table-card">

        <div class="table-responsive">

            <table class="table category-table align-middle">


                <!-- =================================================
                     TABLE HEADER
                ================================================== -->

                <thead>

                    <tr>

                        <th>
                            S.No
                        </th>

                        <th>
                            Image
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Description
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>



                <!-- =================================================
                     TABLE BODY
                ================================================== -->

                <tbody id="categoryTableBody">


                    <!-- =================================================
                         CATEGORY ROW
                    ================================================== -->

                    <tr
                        th:each="category, stat : ${categories}"
                        data-category-row>


                        <!-- S.NO -->

                        <td>

                            <span
                                class="category-number"
                                th:text="${stat.count}">

                                1

                            </span>

                        </td>



                        <!-- =================================================
                             CATEGORY IMAGE
                        ================================================== -->

                        <td>

                            <div
                                th:if="${category.image != null and !#strings.isEmpty(category.image)}">

                                <img
                                    th:src="${category.image}"
                                    class="category-image"
                                    th:alt="${category.name}"
                                    alt="Category Image">

                            </div>


                            <div
                                th:unless="${category.image != null and !#strings.isEmpty(category.image)}"
                                class="category-image d-flex align-items-center justify-content-center">

                                <i class="fa-solid fa-image text-muted"></i>

                            </div>

                        </td>



                        <!-- =================================================
                             CATEGORY NAME
                        ================================================== -->

                        <td>

                            <span
                                class="category-name"
                                th:text="${category.name}">

                                Category Name

                            </span>

                        </td>



                        <!-- =================================================
                             DESCRIPTION
                        ================================================== -->

                        <td>

                            <span
                                class="category-description"
                                th:text="${category.description != null && !#strings.isEmpty(category.description)
                                ? category.description
                                : 'No description available'}">

                                Description

                            </span>

                        </td>



                        <!-- =================================================
                             ACTIONS
                        ================================================== -->

                        <td>

                            <div class="category-actions">


                                <!-- EDIT -->

                                <a
                                    th:href="@{/admin/categories/edit/{id}(id=${category.id})}"
                                    class="btn-edit-category"
                                    title="Edit Category">

                                    <i class="fa-solid fa-pen"></i>

                                </a>

                                <!-- DELETE -->

                                <a
                                    th:href="@{/admin/categories/delete/{id}(id=${category.id})}"
                                    class="btn-delete-category deleteCategory"
                                    title="Delete Category">

                                    <i class="fa-solid fa-trash"></i>

                                </a>


                            </div>

                        </td>


                    </tr>

                    <!-- =================================================
                         EMPTY STATE
                    ================================================== -->

                    <tr
                        th:if="${#lists.isEmpty(categories)}">

                        <td colspan="5">

                            <div class="empty-category">

                                <i class="fa-solid fa-layer-group"></i>


                                <h5>

                                    No Categories Found

                                </h5>


                                <p>

                                    Start by adding your first
                                    product category.

                                </p>


                                <button
                                    type="button"
                                    class="btn-add-category"
                                    id="emptyAddCategoryBtn">

                                    <i class="fa-solid fa-plus"></i>

                                    Add Category

                                </button>

                            </div>

                        </td>

                    </tr>


                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- =====================================================
     CATEGORY MODAL
====================================================== -->

<div
    class="category-modal-overlay"
    id="categoryModal">


    <div class="category-modal-box">


            <!-- =================================================
                 MODAL HEADER
            ================================================== -->

           <div class="category-modal-header">

                <h5
                    class="modal-title"
                    id="categoryModalTitle"
                    th:text="${category.id == null
                    ? 'Add Category'
                    : 'Edit Category'}">

                    Add Category

                </h5>


                <button
                    type="button"
                    class="btn-close btn-close-white"
                    id="closeCategoryModalBtn"
                    aria-label="Close">
                </button>

            </div>



            <!-- =================================================
                 MODAL BODY
            ================================================== -->

            <div class="category-modal-body">


                <form
                    th:action="${category.id == null}
                    ? @{/admin/categories/save}
                    : @{/admin/categories/update}"
                    th:object="${category}"
                    method="post"
                    enctype="multipart/form-data">


                    <!-- =================================================
                         HIDDEN ID
                    ================================================== -->

                    <input
                        type="hidden"
                        th:field="*{id}">



                    <!-- =================================================
                         CATEGORY NAME
                    ================================================== -->

                    <div class="mb-3">

                        <label
                            for="categoryName"
                            class="form-label">

                            Category Name

                        </label>


                        <input
                            type="text"
                            id="categoryName"
                            class="form-control"
                            th:field="*{name}"
                            autocomplete="off"
                            placeholder="Enter category name"
                            required>

                    </div>



                    <!-- =================================================
                         DESCRIPTION
                    ================================================== -->

                    <div class="mb-3">

                        <label
                            for="categoryDescription"
                            class="form-label">

                            Description

                        </label>


                        <textarea
                            id="categoryDescription"
                            class="form-control"
                            rows="4"
                            th:field="*{description}"
                            placeholder="Enter category description">
                        </textarea>

                    </div>



                    <!-- =================================================
                         IMAGE UPLOAD
                    ================================================== -->

                    <div class="mb-3">

                        <label
                            for="imageFile"
                            class="form-label">

                            Category Image

                        </label>


                        <input
                            type="file"
                            id="imageFile"
                            name="imageFile"
                            class="form-control"
                            accept="image/*">


                        <div class="form-text">

                            JPG, JPEG, PNG or WEBP recommended.

                        </div>

                    </div>



                    <!-- =================================================
                         IMAGE PREVIEW
                    ================================================== -->

                    <div class="text-center mb-4">

                        <img
                            th:if="${category.image != null and !#strings.isEmpty(category.image)}"
                            id="previewImage"
                            th:src="${category.image}"
                            width="200"
                            height="150"
                            class="img-thumbnail"
                            alt="Category Preview">


                        <img
                            th:unless="${category.image != null and !#strings.isEmpty(category.image)}"
                            id="previewImage"
                            src="https://placehold.co/200x150?text=Category+Preview"
                            width="200"
                            height="150"
                            class="img-thumbnail"
                            alt="Category Preview">

                    </div>



                    <!-- =================================================
                         SAVE / UPDATE
                    ================================================== -->

                    <button
                        type="submit"
                        class="btn btn-success w-100">

                        <i
                            th:class="${category.id == null}
                            ? 'fa-solid fa-floppy-disk'
                            : 'fa-solid fa-pen-to-square'">
                        </i>


                        <span
                            th:text="${category.id == null}
                            ? 'Save Category'
                            : 'Update Category'}">

                            Save Category

                        </span>

                    </button>


                </form>

            </div>

        </div>

    </div>

</div>

<!-- =====================================================
     BOOTSTRAP JS
====================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<!-- =====================================================
     SWEET ALERT
====================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
</script>



<!-- =====================================================
     ADMIN CATEGORY JS
====================================================== -->

<script
    th:src="@{/js/admin-category.js}">
</script>



<!-- =====================================================
     CATEGORY PAGE JAVASCRIPT
====================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    console.log("ADMIN CATEGORY PAGE LOADED");


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const addCategoryBtn =
        document.getElementById("addCategoryBtn");

    const emptyAddCategoryBtn =
        document.getElementById("emptyAddCategoryBtn");

    const categoryModalElement =
        document.getElementById("categoryModal");

    const closeCategoryModalBtn =
        document.getElementById("closeCategoryModalBtn");

    const searchInput =
        document.getElementById("searchCategory");

    const tableBody =
        document.getElementById("categoryTableBody");

    const imageInput =
        document.getElementById("imageFile");

    const previewImage =
        document.getElementById("previewImage");


    console.log("Add button:", addCategoryBtn);

    console.log("Modal:", categoryModalElement);



    /* =====================================================
       OPEN MODAL
    ===================================================== */

    function openCategoryModal() {

        console.log("OPEN CATEGORY MODAL");


        if (!categoryModalElement) {

            console.error(
                "categoryModal not found"
            );

            return;
        }


        categoryModalElement.classList.add("show");

        categoryModalElement.style.display = "flex";

        document.body.style.overflow = "hidden";
    }



    /* =====================================================
       CLOSE MODAL
    ===================================================== */

    function closeCategoryModal() {

        if (!categoryModalElement) {
            return;
        }


        categoryModalElement.classList.remove("show");

        categoryModalElement.style.display = "none";

        document.body.style.overflow = "";
    }



    /* =====================================================
       ADD CATEGORY BUTTON
    ===================================================== */

    if (addCategoryBtn) {

        addCategoryBtn.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                openCategoryModal();

            }
        );

    } else {

        console.error(
            "Add Category button not found"
        );

    }



    /* =====================================================
       EMPTY STATE ADD BUTTON
    ===================================================== */

    if (emptyAddCategoryBtn) {

        emptyAddCategoryBtn.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                openCategoryModal();

            }
        );

    }



    /* =====================================================
       CLOSE BUTTON
    ===================================================== */

    if (closeCategoryModalBtn) {

        closeCategoryModalBtn.addEventListener(
            "click",
            function () {

                closeCategoryModal();

            }
        );

    }



    /* =====================================================
       CLICK OUTSIDE MODAL
    ===================================================== */

    if (categoryModalElement) {

        categoryModalElement.addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    categoryModalElement
                ) {

                    closeCategoryModal();

                }

            }
        );

    }



    /* =====================================================
       ESC KEY
    ===================================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Escape") {

                closeCategoryModal();

            }

        }
    );



    /* =====================================================
       SEARCH
    ===================================================== */

    if (searchInput && tableBody) {

        searchInput.addEventListener(
            "input",
            function () {

                const searchValue =
                    this.value
                        .toLowerCase()
                        .trim();


                const rows =
                    tableBody.querySelectorAll(
                        "tr[data-category-row]"
                    );


                rows.forEach(function (row) {

                    const rowText =
                        row.innerText
                            .toLowerCase();


                    if (
                        rowText.includes(
                            searchValue
                        )
                    ) {

                        row.style.display = "";

                    } else {

                        row.style.display = "none";

                    }

                });

            }
        );

    }



    /* =====================================================
       IMAGE PREVIEW
    ===================================================== */

    if (imageInput && previewImage) {

        imageInput.addEventListener(
            "change",
            function () {

                const file =
                    this.files[0];


                if (!file) {
                    return;
                }


                if (
                    !file.type.startsWith("image/")
                ) {

                    alert(
                        "Please select a valid image."
                    );

                    this.value = "";

                    return;
                }


                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {

                        previewImage.src =
                            event.target.result;

                    };


                reader.readAsDataURL(file);

            }
        );

    }



    /* =====================================================
       DELETE CATEGORY
    ===================================================== */

    const deleteButtons =
        document.querySelectorAll(
            ".deleteCategory"
        );


    deleteButtons.forEach(
        function (button) {

            button.addEventListener(
                "click",
                function (event) {

                    event.preventDefault();


                    const deleteUrl =
                        this.getAttribute("href");


                    const confirmDelete =
                        confirm(
                            "Delete this category?"
                        );


                    if (confirmDelete) {

                        window.location.href =
                            deleteUrl;

                    }

                }
            );

        }
    );


});

</script>
</body>
</html>
