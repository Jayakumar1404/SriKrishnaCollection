<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Orders</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
rel="stylesheet">

<link rel="stylesheet"
th:href="@{/css/my-orders.css}">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand"
th:href="@{/Krishna/home}">

Sri Krishna Collection

</a>

</div>

</nav>

<div class="container mt-5">

<h2 class="text-center mb-4">

My Orders

</h2>

<table class="table table-hover table-bordered shadow">

<thead class="table-dark">

<tr>

<th>Order ID</th>

<th>Date</th>

<th>Total</th>

<th>Payment</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<tr th:each="order : ${orders}">

<td th:text="${order.id}"></td>

<td th:text="${order.orderDate}"></td>

<td>

₹

<span th:text="${order.totalAmount}"></span>

</td>

<td th:text="${order.paymentMethod}"></td>

<td>

<span class="badge bg-success"

th:text="${order.orderStatus}">

</span>

</td>

<td>

<button class="btn btn-primary btn-sm viewBtn">

View

</button>

<button class="btn btn-danger btn-sm cancelBtn">

Cancel

</button>

</td>

</tr>

</tbody>

</table>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:src="@{/js/my-orders.js}"></script>

</body>

</html>
