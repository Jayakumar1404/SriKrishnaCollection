<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Sri Krishna Collection</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          rel="stylesheet">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Jost:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          th:href="@{/css/reset-password.css}">

</head>

<body>

<div class="reset-section">

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-lg-5 col-md-7">

                <div class="reset-card">

                    <!-- Logo -->

                    <div class="text-center mb-4">

                        <img th:src="@{/images/logo.png}"
                             class="logo">

                        <h2 class="brand-title">

                            Sri Krishna Collection

                        </h2>

                        <p class="text-light">

                            Reset Your Password

                        </p>

                    </div>

                    <!-- Form -->

                    <form id="resetForm">

                        <!-- New Password -->

                        <div class="mb-3">

                            <label class="form-label">

                                New Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="fa-solid fa-lock"></i>

                                </span>

                                <input

                                        type="password"

                                        id="password"

                                        class="form-control"

                                        placeholder="Enter New Password"

                                        required>

                                <button

                                        class="btn btn-outline-light"

                                        type="button"

                                        id="togglePassword">

                                    <i class="fa-solid fa-eye"></i>

                                </button>

                            </div>

                        </div>

                        <!-- Confirm Password -->

                        <div class="mb-3">

                            <label class="form-label">

                                Confirm Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="fa-solid fa-lock"></i>

                                </span>

                                <input

                                        type="password"

                                        id="confirmPassword"

                                        class="form-control"

                                        placeholder="Confirm Password"

                                        required>

                                <button

                                        class="btn btn-outline-light"

                                        type="button"

                                        id="toggleConfirm">

                                    <i class="fa-solid fa-eye"></i>

                                </button>

                            </div>

                        </div>

                        <!-- Password Strength -->

                        <div class="progress mt-3">

                            <div id="strengthBar"

                                 class="progress-bar bg-danger"

                                 style="width:0%;">

                            </div>

                        </div>

                        <small id="strengthText"
                               class="text-warning">

                            Password Strength

                        </small>

                        <!-- Reset Button -->

                        <button

                                type="submit"

                                class="btn btn-warning w-100 reset-btn mt-4">

                            <i class="fa-solid fa-key"></i>

                            Reset Password

                        </button>

                        <hr>

                        <div class="text-center">

                            <a th:href="@{/Krishna/login}">

                                Back To Login

                            </a>

                        </div>                        <!-- Password Rules -->

                        <div class="alert alert-info mt-3">

                            <i class="fa-solid fa-circle-info"></i>

                            Password must contain at least:

                            <ul class="mt-2 mb-0">

                                <li>8 Characters</li>

                                <li>1 Uppercase Letter</li>

                                <li>1 Lowercase Letter</li>

                                <li>1 Number</li>

                                <li>1 Special Character</li>

                            </ul>

                        </div>

                    </form>

                </div>

                <!-- Footer -->

                <div class="text-center mt-4">

                    <small class="text-light">

                        © 2026 Sri Krishna Collection

                        <br>

                        Premium Women's Fashion Store

                    </small>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SweetAlert -->

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- JavaScript -->

<script th:src="@{/js/reset-password.js}"></script>

</body>

</html>
