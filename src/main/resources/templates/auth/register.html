<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Sri Krishna Collection</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Jost:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/register.css}">

</head>

<body>

    <div class="register-section">

        <div class="container">

            <div class="row justify-content-center align-items-center min-vh-100">

                <div class="col-lg-7 col-md-9">

                    <div class="register-card">

                        <!-- Logo -->

                        <div class="text-center mb-4">

                            <img th:src="@{/images/logo.png}" class="logo">

                            <h2 class="brand-title">
                                Sri Krishna Collection
                            </h2>

                            <p class="text-light">
                                Create Your Account
                            </p>

                        </div>

                        <!-- Registration Form -->

                        <form id="registerForm">

                            <div class="row">

                                <!-- Full Name -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Full Name
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">

                                            <i class="fa-solid fa-user"></i>

                                        </span>

                                        <input type="text" id="fullname" class="form-control"
                                            placeholder="Enter Full Name" required>

                                    </div>

                                </div>

                                <!-- Email -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        Email Address

                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">

                                            <i class="fa-solid fa-envelope"></i>

                                        </span>

                                        <input type="email" id="email" class="form-control" placeholder="Enter Email"
                                            required>

                                    </div>

                                </div>

                                <!-- Mobile -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        Mobile Number

                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">

                                            <i class="fa-solid fa-phone"></i>

                                        </span>

                                        <input type="tel" id="mobile" class="form-control" maxlength="10"
                                            placeholder="Enter Mobile Number" required>

                                    </div>

                                </div>

                                <!-- Gender -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        Gender

                                    </label>

                                    <select id="gender" class="form-select" required>

                                        <option value="">Select Gender</option>

                                        <option>Male</option>

                                        <option>Female</option>

                                        <option>Other</option>

                                    </select>

                                </div>

                                <!-- DOB -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        Date of Birth

                                    </label>

                                    <input type="date" id="dob" class="form-control" required>

                                </div>

                                <!-- City -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        City

                                    </label>

                                    <input type="text" id="city" class="form-control" placeholder="Enter City" required>

                                </div>

                                <!-- Password -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        Password

                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">

                                            <i class="fa-solid fa-lock"></i>

                                        </span>

                                        <input type="password" id="password" class="form-control"
                                            placeholder="Enter Password" required>

                                        <button class="btn btn-outline-light" type="button" id="togglePassword">

                                            <i class="fa-solid fa-eye"></i>

                                        </button>

                                    </div>

                                </div>

                                <!-- Confirm Password -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        Confirm Password

                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">

                                            <i class="fa-solid fa-lock"></i>

                                        </span>

                                        <input type="password" id="confirmPassword" class="form-control"
                                            placeholder="Confirm Password" required>

                                        <button class="btn btn-outline-light" type="button" id="toggleConfirm">

                                            <i class="fa-solid fa-eye"></i>

                                        </button>

                                    </div>

                                </div>
                                <!-- Password Strength -->

                                <div class="col-12 mb-3">

                                    <div class="progress" style="height:8px;">

                                        <div id="strengthBar" class="progress-bar bg-danger" style="width:0%">

                                        </div>

                                    </div>

                                    <small id="strengthText" class="text-warning">

                                        Password Strength

                                    </small>

                                </div>

                                <!-- Terms -->

                                <div class="col-12 mb-4">

                                    <div class="form-check">

                                        <input class="form-check-input" type="checkbox" id="terms" required>

                                        <label class="form-check-label text-light" for="terms">

                                            I agree to the

                                            <a href="#">

                                                Terms & Conditions

                                            </a>

                                            and

                                            <a href="#">

                                                Privacy Policy

                                            </a>

                                        </label>

                                    </div>

                                </div>

                                <!-- Register Button -->

                                <div class="col-12">

                                    <button type="submit" class="btn btn-warning w-100 register-btn">

                                        <i class="fa-solid fa-user-plus"></i>

                                        Create Account

                                    </button>

                                </div>

                                <!-- Divider -->

                                <div class="col-12 my-4">

                                    <div class="d-flex align-items-center">

                                        <hr class="flex-grow-1">

                                        <span class="px-3 text-light">

                                            OR

                                        </span>

                                        <hr class="flex-grow-1">

                                    </div>

                                </div>

                                <!-- Google Register -->

                                <div class="col-12">

                                    <button type="button" class="btn btn-light border w-100">

                                        <i class="fa-brands fa-google text-danger">

                                        </i>

                                        Continue with Google

                                    </button>

                                </div>

                                <!-- Login -->

                                <div class="col-12 text-center mt-4">

                                    <p class="text-light">

                                        Already have an account?

                                        <a th:href="@{/Krishna/login}">

                                            Login Here

                                        </a>

                                    </p>

                                </div>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Register JS -->

    <script th:src="@{/js/register.js}"></script>

</body>

</html>
