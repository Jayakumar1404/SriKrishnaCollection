<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OTP Verification | Sri Krishna Collection</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          rel="stylesheet">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Jost:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          th:href="@{/css/otp.css}">

</head>

<body>

<div class="otp-section">

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-lg-5 col-md-7">

                <div class="otp-card">

                    <!-- Logo -->

                    <div class="text-center mb-4">

                        <img th:src="@{/images/logo.png}"
                             class="logo">

                        <h2 class="brand-title">

                            Sri Krishna Collection

                        </h2>

                        <p class="text-light">

                            OTP Verification

                        </p>

                    </div>

                    <!-- Form -->

                    <form id="otpForm">

                        <p class="text-center text-light">

                            Enter the 6-digit verification code

                        </p>

                        <div class="otp-container">

                            <input type="text" maxlength="1" class="otp-input" required>

                            <input type="text" maxlength="1" class="otp-input" required>

                            <input type="text" maxlength="1" class="otp-input" required>

                            <input type="text" maxlength="1" class="otp-input" required>

                            <input type="text" maxlength="1" class="otp-input" required>

                            <input type="text" maxlength="1" class="otp-input" required>

                        </div>

                        <div class="text-center mt-4">

                            <h5 id="timer">

                                01 : 00

                            </h5>

                        </div>

                        <button
                                type="submit"
                                class="btn btn-warning w-100 verify-btn mt-4">

                            <i class="fa-solid fa-shield-halved"></i>

                            Verify OTP

                        </button>

                        <div class="text-center mt-4">

                            Didn't receive OTP?

                            <br>

                            <a href="#" id="resendOtp">

                                Resend OTP

                            </a>

                        </div>

                        <div class="text-center mt-3">

                            <a th:href="@{/Krishna/login}">

                                Back to Login

                            </a>

                        </div>
                                                </div>

                    </form>

                </div>

                <!-- Footer -->

                <div class="text-center mt-4">

                    <small class="text-light">

                        © 2026 Sri Krishna Collection

                        <br>

                        Premium Women's Fashion Store

                    </small>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SweetAlert -->

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- OTP JavaScript -->

<script th:src="@{/js/otp.js}"></script>

</body>

</html>
