<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Sri Krishna Collection</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Jost:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">

</head>

<body>

    <div class="forgot-section">

        <div class="container">

            <div class="row justify-content-center align-items-center min-vh-100">

                <div class="col-lg-5 col-md-7 col-sm-10">

                    <div class="forgot-card">

                        <!-- Logo -->

                        <div class="text-center mb-4">

                            <img th:src="@{/images/logo.png}" class="logo">

                            <h2 class="brand-title">

                                Sri Krishna Collection

                            </h2>

                            <p class="text-light">

                                Forgot Your Password?

                            </p>

                        </div>

                        <!-- Form -->

                        <form id="forgotForm">

                            <!-- Email -->

                            <div class="mb-4">

                                <label class="form-label">

                                    Registered Email

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">

                                        <i class="fa-solid fa-envelope"></i>

                                    </span>

                                    <input type="email" id="email" class="form-control"
                                        placeholder="Enter Registered Email" required>

                                </div>

                            </div>

                            <!-- Information -->

                            <div class="alert alert-info">

                                <i class="fa-solid fa-circle-info"></i>

                                Enter your registered email address.

                                We will send a One Time Password (OTP)

                                to reset your password.

                            </div>

                            <!-- Send OTP Button -->

                            <button type="submit" class="btn btn-warning w-100 send-btn">

                                <i class="fa-solid fa-paper-plane"></i>

                                Send OTP

                            </button>

                            <hr>

                            <!-- Back -->

                            <div class="text-center mt-3">

                                Remember your password?

                                <a th:href="@{/Krishna/login}">

                                    Login Here

                                </a>

                            </div>
                                                    <!-- Social Login -->

                        <div class="social-section mt-4">

                            <p class="text-center text-light mb-3">

                                Or Continue With

                            </p>

                            <div class="d-flex justify-content-center gap-3">

                                <button type="button"
                                        class="btn btn-light social-btn">

                                    <i class="fab fa-google text-danger"></i>

                                </button>

                                <button type="button"
                                        class="btn btn-light social-btn">

                                    <i class="fab fa-facebook-f text-primary"></i>

                                </button>

                                <button type="button"
                                        class="btn btn-light social-btn">

                                    <i class="fab fa-github"></i>

                                </button>

                            </div>

                        </div>

                    </form>

                </div>

                <!-- Footer -->

                <div class="text-center mt-4">

                    <small class="text-light">

                        © 2026 Sri Krishna Collection

                        <br>

                        Premium Women's Fashion Store

                    </small>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SweetAlert2 -->

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Forgot Password JS -->

<script th:src="@{/js/forgot-password.js}"></script>

</body>

</html>
