# ============================================
# Application
# ============================================
spring.application.name=SriKrishnaCollection
server.port=8080

# ============================================
# MySQL Database   s
# ===========================================

spring.datasource.url=jdbc:mysql://mysql-1b515f36-srikrishna.i.aivencloud.com:27382/srikrishna_collection?sslMode=REQUIRED
spring.datasource.username=${db_id}
spring.datasource.password=${db_pass}


# ============================================
# Hibernate / JPA
# ============================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================
# Thymeleaf
# ============================================
spring.thymeleaf.cache=false

# ============================================
# Static Resources
# ============================================


# ============================================
# File Upload
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ============================================
# Security
# ============================================


# ============================================
# Mail Configuration
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail_id}
spring.mail.password=${mail_pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================
# JWT Configuration
# ============================================
jwt.secret=${jwt_secret}
jwt.expiration=86400000

# ============================================
# Swagger
# ============================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ============================================
# Logging
# ============================================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ============================================
# Actuator
# ============================================


# ============================================
# Error Handling
# ============================================
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================
# Character Encoding
# ============================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true


# ============================================
#        Image Upload Configuration
# ============================================
spring.web.resources.static-locations=classpath:/static/,file:uploads/
management.endpoints.web.exposure.include=mappings

# =========================================================
# RAZORPAY
# =========================================================

razorpay.key.id=${razorpay_id}
razorpay.key.secret=${razorpay_secret}